<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin · AdRewards</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f7fc;
        }

        .admin {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            color: #1b3a6b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1b3a6b;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #dce3ed;
            border-radius: 10px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 30px;
            background: #1b3a6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b1c3a;
        }

        #videoPreview {
            width: 100%;
            margin-top: 20px;
            border-radius: 15px;
            display: none;
        }

        #message {
            margin-top: 15px;
            color: #1b3a6b;
        }

    </style>

</head>


<body>

<div class="admin">

    <h1>🔐 AdRewards Admin</h1>

    <p>
        Create a new advertisement.
    </p>


    <label>
        Advertisement title
    </label>

    <input
        type="text"
        id="adTitle"
        placeholder="Example: Premium Headphones"
    >


    <label>
        Description
    </label>

    <textarea
        id="adDescription"
        placeholder="Describe the advertisement..."
    ></textarea>


    <label>
        Reward points
    </label>

    <input
        type="number"
        id="adReward"
        placeholder="15"
        min="1"
    >


    <label>
        Advertisement video
    </label>

    <input
        type="file"
        id="videoInput"
        accept="video/*"
    >


    <video
        id="videoPreview"
        controls>
    </video>


    <button id="previewButton">
        Preview Advertisement
    </button>


    <p id="message"></p>

</div>


<script>

    const videoInput =
        document.getElementById('videoInput');

    const videoPreview =
        document.getElementById('videoPreview');

    const previewButton =
        document.getElementById('previewButton');

    const message =
        document.getElementById('message');


    videoInput.addEventListener(
        'change',
        function() {

            const file = videoInput.files[0];

            if (!file) {
                return;
            }

            const videoURL =
                URL.createObjectURL(file);

            videoPreview.src = videoURL;

            videoPreview.style.display = 'block';

        }
    );
previewButton.addEventListener('click', function() {

    const title = document.getElementById('adTitle').value.trim();
    const description = document.getElementById('adDescription').value.trim();
    const reward = document.getElementById('adReward').value;

    if (!title) {
        message.textContent = 'Please enter an advertisement title.';
        return;
    }

    if (!description) {
        message.textContent = 'Please enter a description.';
        return;
    }

    if (!reward) {
        message.textContent = 'Please enter a reward amount.';
        return;
    }

    if (!videoInput.files[0]) {
        message.textContent = 'Please select a video.';
        return;
    }

    // Get existing advertisements
    const ads = JSON.parse(localStorage.getItem('ads')) || [];

    // Create new advertisement
    const newAd = {
        id: Date.now(),
        title: title,
        description: description,
        reward: Number(reward)
    };

    // Add advertisement to the list
    ads.push(newAd);

    // Save the list
    localStorage.setItem('ads', JSON.stringify(ads));

    message.textContent = 'Advertisement saved successfully! 🎉';
});


</script>

</body>

</html>
